name: FallingTimber
version: '1.4.2'
main: io.github.benjaminl11au.fallingtimber.FallingTimberPlugin
description: Fell an entire tree by breaking one log with an axe.
author: BenJaminL11-AU
website: https://github.com/BenJaminL11-AU/FallingTimber
api-version: '26.3'

commands:
  fallingtimber:
    description: Control FallingTimber.
    usage: /fallingtimber <toggle|leaves|global|status|debug|inspect|stats|top|version|reload|help>
    aliases: [timber, ftimber]
    permission: fallingtimber.command

permissions:
  fallingtimber.use:
    description: Allows a player to fell whole trees.
    default: true
  fallingtimber.command:
    description: Allows access to FallingTimber player commands.
    default: true
  fallingtimber.reload:
    description: Allows reloading the FallingTimber configuration.
    default: op
  fallingtimber.inspect:
    description: Allows detailed inspection of targeted trees.
    default: op
  fallingtimber.stats.others:
    description: Allows viewing another player's Timber statistics.
    default: op
  fallingtimber.update-notify:
    description: Receives join notifications when a new release is available.
    default: op
  fallingtimber.global:
    description: Allows changing the global FallingTimber enabled state in-game.
    default: op
